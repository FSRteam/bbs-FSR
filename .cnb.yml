            chmod +x ./gradlew
            if ./gradlew --no-daemon clean build --stacktrace; then
              exit 0
            fi

            echo "[cnb] Primary build failed. Retrying with mirror-primary repositories..."
            ./gradlew --no-daemon clean build --stacktrace -PbbsPreferMirror=true
