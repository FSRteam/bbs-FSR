main:
  push:
    - runner:
        cpus: 4
      docker:
        image: eclipse-temurin:21-jdk
        volumes:
          - main:/workspace/.gradle-home/caches:copy-on-write
          - main:/workspace/.gradle-home/wrapper:copy-on-write
      stages:
        - name: build
          script: |
            set -eu
            export GRADLE_USER_HOME=/workspace/.gradle-home
            chmod +x ./gradlew
            max_retries=3

            run_build_with_retry() {
              mode_label="$1"
              extra_args="$2"
              attempt=1

              while [ "$attempt" -le "$max_retries" ]; do
                echo "[cnb] ${mode_label} attempt ${attempt}/${max_retries}"

                if [ -n "$extra_args" ]; then
                  if ./gradlew --no-daemon build --stacktrace "$extra_args"; then
                    return 0
                  fi
                else
                  if ./gradlew --no-daemon build --stacktrace; then
                    return 0
                  fi
                fi

                if [ "$attempt" -lt "$max_retries" ]; then
                  echo "[cnb] ${mode_label} failed. Waiting before retry..."
                  sleep 10
                fi

                attempt=$((attempt + 1))
              done

              return 1
            }

            if run_build_with_retry "primary" ""; then
              exit 0
            fi

            echo "[cnb] Primary build failed after ${max_retries} attempts. Switching to mirror-primary mode..."
            run_build_with_retry "mirror-primary" "-PbbsPreferMirror=true"

