main:
  push:
    - runner:
        cpus: 2
        memory: 8
      docker:
        image: eclipse-temurin:21-jdk
      cache:
        - /root/.gradle/caches
        - /root/.gradle/wrapper
      stages:
        - name: build
          script: |
            set -eu
            chmod +x ./gradlew
            if ./gradlew --no-daemon clean build --stacktrace; then
              exit 0
            fi

            echo "[cnb] Primary build failed. Retrying with mirror-primary repositories..."
            ./gradlew --no-daemon clean build --stacktrace -PbbsPreferMirror=true

  api_trigger:
    - runner:
        cpus: 2
        memory: 8
      docker:
        image: eclipse-temurin:21-jdk
      cache:
        - /root/.gradle/caches
        - /root/.gradle/wrapper
      stages:
        - name: build
          script: |
