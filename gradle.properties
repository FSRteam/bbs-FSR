# Performance-oriented Gradle runtime settings.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=false
org.gradle.workers.max=2

# Default to NeoForged official repo; set -PbbsPreferMirror=true or BBS_PREFER_MIRROR=true to prefer mirror.
bbsPreferMirror=false
bbsNeoMirrorUrl=https://cdnneo.sweatent.top/releases
# bbsProxyKey is read from -PbbsProxyKey or BBS_PROXY_KEY; keep secrets out of VCS.

# Core mod coordinates
mod_id=bbs
mod_name=BBS FS mod
mod_license=MIT
mod_version=2.3.1
mod_group_id=mchorse
archives_base_name=bbs

# Platform versions (NeoForge 1.21.1)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
java_version=21
neo_version=21.1.222
neo_version_range=[21.1,)
loader_version_range=[1,)

bmclapi.url=https://bmclapi2.bangbang93.com
org.gradle.caching=false

# Optional: parchment mappings (keep commented until needed)
# neogradle.subsystems.parchment.minecraftVersion=1.21.1
# neogradle.subsystems.parchment.mappingsVersion=2024.11.17
