def cliPreferMirror = gradle.startParameter.projectProperties.get("bbsPreferMirror")
def envPreferMirror = System.getenv("BBS_PREFER_MIRROR")
def bbsPreferMirror = (cliPreferMirror ?: (envPreferMirror ?: (findProperty("bbsPreferMirror")?.toString() ?: "false"))).toBoolean()
def bbsNeoMirrorUrl = findProperty("bbsNeoMirrorUrl")?.toString() ?: "https://cdnneo.sweatent.top/releases"
def bbsProxyKey = findProperty("bbsProxyKey")?.toString() ?: (System.getenv("BBS_PROXY_KEY") ?: "")
def neoForgedOfficial = 'https://maven.neoforged.net/releases'
def neoForgedMirror = bbsNeoMirrorUrl
String forceBuildProperty = providers.gradleProperty('forceBuild').orNull

if (forceBuildProperty != null
    && !['true', 'false'].contains(forceBuildProperty.toLowerCase(Locale.ROOT))) {
    throw new GradleException("forceBuild must be true or false; use -PforceBuild=true only for an explicit forced build")
}

boolean forceBuild = 'true'.equalsIgnoreCase(forceBuildProperty)

def applyBbsProxyHeaderAuth = { MavenArtifactRepository repository, String repositoryUrl ->
    if (!repositoryUrl.contains("cdnneo.sweatent.top") || bbsProxyKey.isEmpty()) {
        return
    }

    repository.credentials(HttpHeaderCredentials) {
        name = "x-proxy-key"
        value = bbsProxyKey
    }
    repository.authentication {
        header(HttpHeaderAuthentication)
    }
}

def rewriteNeoForgedRepoUrl = { MavenArtifactRepository repository ->
    if (!bbsPreferMirror || repository.url == null) {
        return
    }

    String repositoryUrl = repository.url.toString().replaceAll('/+$', '')
    String officialUrl = neoForgedOfficial.replaceAll('/+$', '')

    if (repositoryUrl == officialUrl) {
        repository.setUrl(uri(neoForgedMirror))
        applyBbsProxyHeaderAuth(repository, neoForgedMirror.toString())
    }
}

