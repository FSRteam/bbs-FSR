import org.gradle.api.artifacts.repositories.MavenArtifactRepository
import org.gradle.api.credentials.HttpHeaderCredentials
import org.gradle.authentication.http.HttpHeaderAuthentication
import java.io.ByteArrayOutputStream
import java.io.OutputStream
import java.nio.charset.StandardCharsets
import java.util.Locale

/** Detect uncaptured ERROR diagnostics emitted by a JavaExec-backed test. */
class BbsTestErrorOutputStream extends OutputStream {
    private final OutputStream delegate
    private final ByteArrayOutputStream line = new ByteArrayOutputStream()
    private boolean error
    private String firstErrorLine

    BbsTestErrorOutputStream(OutputStream delegate) {
        this.delegate = delegate
    }

    @Override
    synchronized void write(int value) throws IOException {
        delegate.write(value)
        this.accept(value)
    }

    @Override
    synchronized void write(byte[] bytes, int offset, int length) throws IOException {
        delegate.write(bytes, offset, length)

        for (int i = offset; i < offset + length; i += 1) {
            this.accept(bytes[i] & 0xff)
        }
    }

    @Override
    synchronized void flush() throws IOException {
        delegate.flush()
    }

    @Override
    synchronized void close() throws IOException {
        this.finish()
        delegate.flush()
    }

    synchronized boolean hasError() {
        this.finish()
        return error
    }

    synchronized String firstErrorLine() {
        this.finish()
        return firstErrorLine
    }

    private void accept(int value) {
        if (value == '\n' || value == '\r') {
            this.inspectLine()
            line.reset()
        } else {
            line.write(value)
        }
    }

    private void finish() {
        if (line.size() > 0) {
            this.inspectLine()
            line.reset()
        }
    }

    private void inspectLine() {
        String value = line.toString(StandardCharsets.UTF_8)
        String upper = value.toUpperCase(Locale.ROOT)

        if (upper.contains('/ERROR]') || upper.contains('[ERROR]') || upper.trim().startsWith('ERROR ')) {
            error = true

            if (firstErrorLine == null) {
                firstErrorLine = value.trim()
            }
        }
    }
}

