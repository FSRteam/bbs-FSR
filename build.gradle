bbsVerificationTaskNames.each { taskName ->
    tasks.named(taskName, JavaExec).configure {
        /* JavaExec exits are strict by default. A forced build is the only
         * opt-in path that lets packaging continue after a test failure. */
        ignoreExitValue = forceBuild

        doFirst {
            def stdoutScanner = new BbsTestErrorOutputStream(System.out)
            def stderrScanner = new BbsTestErrorOutputStream(System.err)

            standardOutput = stdoutScanner
            errorOutput = stderrScanner
            extensions.extraProperties.set('bbsStdoutScanner', stdoutScanner)
            extensions.extraProperties.set('bbsStderrScanner', stderrScanner)

            if (forceBuild) {
                logger.warn("[BBS-BUILD] forceBuild=true: test failures in ${path} will not fail the build")
            }
        }

        doLast {
            def stdoutScanner = extensions.extraProperties.get('bbsStdoutScanner') as BbsTestErrorOutputStream
            def stderrScanner = extensions.extraProperties.get('bbsStderrScanner') as BbsTestErrorOutputStream
            boolean testLoggedError = stdoutScanner.hasError() || stderrScanner.hasError()

            if (testLoggedError) {
                String diagnostic = stdoutScanner.firstErrorLine() ?: stderrScanner.firstErrorLine() ?: 'ERROR diagnostic'

                if (!forceBuild) {
                    throw new GradleException("${path} emitted an uncaptured ERROR diagnostic: ${diagnostic}")
                }

                logger.warn("[BBS-BUILD] forceBuild=true ignored test ERROR diagnostic from ${path}: ${diagnostic}")
            }
        }
    }
}

tasks.withType(JavaExec).matching { it.name.startsWith('test') }.configureEach {
    /* Gradle captures test output, so no interactive JLine terminal exists. */
    systemProperty 'terminal.jline', 'false'
}

tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    systemProperty 'terminal.jline', 'false'
    ignoreFailures = forceBuild
}

tasks.named('check') {
    dependsOn bbsVerificationTaskNames.collect { tasks.named(it) }
}

tasks.named('build') {
    doFirst {
        if (forceBuild) {
            logger.warn('[BBS-BUILD] forced build enabled; compile, resource, and packaging failures remain fatal')
        }
    }
}

