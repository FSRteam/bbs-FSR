import org.gradle.api.artifacts.repositories.MavenArtifactRepository
import org.gradle.api.credentials.HttpHeaderCredentials
import org.gradle.authentication.http.HttpHeaderAuthentication

plugins {
    id 'net.neoforged.gradle.userdev' version '7.1.21'
    id 'maven-publish'
}

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

def cliPreferMirror = gradle.startParameter.projectProperties.get("bbsPreferMirror")
def envPreferMirror = System.getenv("BBS_PREFER_MIRROR")
def bbsPreferMirror = (cliPreferMirror ?: (envPreferMirror ?: (findProperty("bbsPreferMirror")?.toString() ?: "false"))).toBoolean()
def bbsNeoMirrorUrl = findProperty("bbsNeoMirrorUrl")?.toString() ?: "https://cdnneo.sweatent.top/releases"
def bbsProxyKey = findProperty("bbsProxyKey")?.toString() ?: (System.getenv("BBS_PROXY_KEY") ?: "")
def neoForgedOfficial = 'https://maven.neoforged.net/releases'
def neoForgedMirror = bbsNeoMirrorUrl

def applyBbsProxyHeaderAuth = { MavenArtifactRepository repository, String repositoryUrl ->
    if (!repositoryUrl.contains("cdnneo.sweatent.top") || bbsProxyKey.isEmpty()) {
        return
    }

    repository.credentials(HttpHeaderCredentials) {
        name = "x-proxy-key"
        value = bbsProxyKey
    }
    repository.authentication {
        header(HttpHeaderAuthentication)
    }
}

def rewriteNeoForgedRepoUrl = { MavenArtifactRepository repository ->
    if (!bbsPreferMirror || repository.url == null) {
        return
    }

    String repositoryUrl = repository.url.toString().replaceAll('/+$', '')
    String officialUrl = neoForgedOfficial.replaceAll('/+$', '')

    if (repositoryUrl == officialUrl) {
        repository.setUrl(uri(neoForgedMirror))
        applyBbsProxyHeaderAuth(repository, neoForgedMirror.toString())
    }
}

version = mod_version
group = mod_group_id

base {
    archivesName = archives_base_name
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources']
    }
    client {
        java.srcDirs = ['src/client/java']
        resources.srcDirs = ['src/client/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    videoExportTest {
        java.srcDirs = ['src/videoExportTest/java']
        resources.srcDirs = []
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    clientImplementation.extendsFrom implementation
    clientCompileOnly.extendsFrom compileOnly
    clientRuntimeOnly.extendsFrom runtimeOnly
    videoExportTestImplementation.extendsFrom implementation
    videoExportTestRuntimeOnly.extendsFrom runtimeOnly
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    maven { url "https://bmclapi2.bangbang93.com/maven" }

    mavenCentral()
    if (bbsPreferMirror) {
        maven {
            name = 'NeoForged Mirror Primary'
            url = neoForgedMirror
            applyBbsProxyHeaderAuth(delegate, neoForgedMirror.toString())
        }
        maven {
            name = 'NeoForged Official Fallback'
            url = neoForgedOfficial
        }
    } else {
        maven {
            name = 'NeoForged Official'
            url = neoForgedOfficial
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

repositories.withType(MavenArtifactRepository).configureEach(rewriteNeoForgedRepoUrl)

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    clientImplementation sourceSets.main.output

    implementation "org.anarres:jcpp:1.4.14"
    implementation "io.github.douira:glsl-transformer:2.0.0-pre13"

    clientCompileOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
    clientCompileOnly "maven.modrinth:iris:1.8.8+1.21.1-neoforge"

    // TODO: validate 1.21.1-compatible versions for optional client mods before re-enabling
    // modCompileOnly "maven.modrinth:distanthorizons:2.1.0-a-1.20.4"
    // modCompileOnly "maven.modrinth:indium:1.0.31+mc1.20.4"
}

tasks.withType(JavaCompile).configureEach {
    // NeoForge 1.21.1 targets Java 21
    options.release = java_version as int
    options.compilerArgs.addAll([
        '-Xdiags:verbose',
        '-Xmaxerrs', '10000',
        '-Xmaxwarns', '10000'
    ])
}

tasks.named('clientClasses') {
    dependsOn tasks.named('compileClientJava')
}

tasks.named('build') {
    dependsOn tasks.named('clientClasses')
}

tasks.register('testVideoExportUtils', JavaExec) {
    dependsOn tasks.named('videoExportTestClasses')
    classpath = sourceSets.videoExportTest.runtimeClasspath
    mainClass = 'mchorse.bbs_mod.utils.VideoExportUtilsTest'
}

tasks.named('check') {
    dependsOn tasks.named('testVideoExportUtils')
}

tasks.named("cacheVersionExtractedServer${minecraft_version}") {
    if (it.respondsTo('getOutput')) {
        it.getOutput().set(layout.projectDirectory.file(".gradle/caches/minecraft/versions/${minecraft_version}/server-extracted.jar"))
    }
}

tasks.named('jar') {
    from sourceSets.client.output
}

processResources {
    inputs.properties(
        mod_id: mod_id,
        mod_version: mod_version,
        mod_name: mod_name,
        mod_license: mod_license,
        minecraft_version: minecraft_version,
        loader_version_range: loader_version_range,
        neo_version_range: neo_version_range
    )

    filesMatching('META-INF/neoforge.mods.toml') {
        expand project.properties
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
