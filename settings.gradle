import org.gradle.api.credentials.HttpHeaderCredentials
import org.gradle.authentication.http.HttpHeaderAuthentication

pluginManagement {
    def bbsPreferMirror = providers.gradleProperty("bbsPreferMirror").orElse("true").get().toBoolean()
    def bbsNeoMirrorUrl = providers.gradleProperty("bbsNeoMirrorUrl").orElse("https://cdnneo.sweatent.top/releases").get()
    def envProxyKey = System.getenv("BBS_PROXY_KEY")
    def bbsProxyKey = providers.gradleProperty("bbsProxyKey").orElse(envProxyKey != null ? envProxyKey : "").get()
    def neoForgedOfficial = 'https://maven.neoforged.net/releases'
    def neoForgedMirror = bbsNeoMirrorUrl

    def applyBbsProxyHeaderAuth = { repository, String url ->
        if (!url.contains("cdnneo.sweatent.top") || bbsProxyKey.isEmpty()) {
            return
        }

        repository.credentials(HttpHeaderCredentials) {
            name = "x-proxy-key"
            value = bbsProxyKey
        }
        repository.authentication {
            header(HttpHeaderAuthentication)
        }
    }

    repositories {
        gradlePluginPortal()
        if (bbsPreferMirror) {
            maven {
                name = 'NeoForged Mirror Primary'
                url = neoForgedMirror
                applyBbsProxyHeaderAuth(delegate, neoForgedMirror.toString())
            }
            maven {
                name = 'NeoForged Official Fallback'
                url = neoForgedOfficial
            }
        } else {
            maven {
                name = 'NeoForged Official Primary'
                url = neoForgedOfficial
            }
            maven {
                name = 'NeoForged Mirror Fallback'
                url = neoForgedMirror
            }
        }
        mavenCentral()
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.neoforged.gradle.userdev' && requested.version != null) {
                useModule("net.neoforged.gradle:userdev:${requested.version}")
            }
        }
    }
}

rootProject.name = "BBS mod"
