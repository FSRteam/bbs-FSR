# Performance-oriented Gradle runtime settings, kept in step with BBS FSR's own file.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false

# Platform versions. Copy these from BBS FSR's gradle.properties rather than from the NeoForge
# website: a mismatch here breaks the dev environment in ways that look like anything but a
# mismatch. BBS FSR on this branch is NeoForge 21.1.222 on Minecraft 1.21.1, Java 21.
minecraft_version=1.21.1
neo_version=21.1.222
java_version=21

# The BBS FSR build to compile against. BBS is not published to any repository, so this only names
# the jar in libs/; see build.gradle and README.md.
bbs_version=0.0.11

mod_id=exampleaddon
mod_name=BBS Addon Template
mod_version=1.0.0
mod_group=com.example
archives_base_name=bbs-addon-template
