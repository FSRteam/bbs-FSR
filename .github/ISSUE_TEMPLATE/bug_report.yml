name: Bug report
description: Report a reproducible problem in BBS FS Reborn
title: "[Bug]: "
labels: [bug, needs-info]
body:
  - type: markdown
    attributes:
      value: |
        For usage questions and open-ended ideas, please use Discussions instead.
  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: "2.3.2 or nightly tag"
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft and NeoForge version
      placeholder: "Minecraft 1.21.1, NeoForge 21.1.222"
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and evidence
      description: Attach relevant logs, crash reports, screenshots, or video. Remove secrets first.
    validations:
      required: true
