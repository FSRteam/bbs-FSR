name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore NeoForge workspace cache
        id: neoforge-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .gradle/caches/minecraft
            .gradle/configuration/neoForm
            .gradle/repositories/ng_dummy_ng
          key: neoforge-official-${{ runner.os }}-java21-${{ hashFiles('gradle.properties', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}-complete
          restore-keys: |
            neoforge-official-${{ runner.os }}-java21-${{ hashFiles('gradle.properties', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}-partial-
            neoforge-official-${{ runner.os }}-java21-

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Validate release metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag_name="$RELEASE_TAG"
          if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag_name" >&2
            exit 1
          fi
          version="${tag_name#v}"
          base_name="$(grep -E '^archives_base_name=' gradle.properties | cut -d= -f2-)"
          {
            echo "tag=$tag_name"
            echo "version=$version"
            echo "artifact_name=${base_name}-${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain --build-cache --parallel --max-workers=2 \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -PbbsPreferMirror=false \
            -Pneogradle.subsystems.decompiler.maxMemory=4096m \
            -Pneogradle.subsystems.decompiler.maxThreads=2 \
            build \
            -Pmod_version="${{ steps.metadata.outputs.version }}" \
            -Parchives_base_name="${{ steps.metadata.outputs.artifact_name }}"

      - name: Save complete NeoForge workspace cache
        if: ${{ success() && steps.neoforge-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .gradle/caches/minecraft
            .gradle/configuration/neoForm
            .gradle/repositories/ng_dummy_ng
          key: neoforge-official-${{ runner.os }}-java21-${{ hashFiles('gradle.properties', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}-complete

      - name: Save partial NeoForge workspace cache after failure
        if: ${{ failure() && steps.neoforge-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            .gradle/caches/minecraft
            .gradle/configuration/neoForm
            .gradle/repositories/ng_dummy_ng
          key: neoforge-official-${{ runner.os }}-java21-${{ hashFiles('gradle.properties', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd build/libs
            sha256sum *.jar
          ) > build/checksums-sha256.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          if-no-files-found: error
          path: |
            build/libs/*.jar
            build/checksums-sha256.txt

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          files: |
            build/libs/*.jar
            build/checksums-sha256.txt
