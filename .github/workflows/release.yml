name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, for example v2.3.2 or v2.4.0-beta.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore NeoForge workspace cache
        uses: actions/cache@v6
        with:
          path: |
            .gradle/caches/minecraft
            .gradle/configuration/neoForm
            .gradle/repositories/ng_dummy_ng
          key: neoforge-${{ runner.os }}-java21-${{ hashFiles('gradle.properties', 'build.gradle', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            neoforge-${{ runner.os }}-java21-

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Validate release metadata
        id: metadata
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_name="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag_name" >&2
            exit 1
          fi
          version="${tag_name#v}"
          base_name="$(grep -E '^archives_base_name=' gradle.properties | cut -d= -f2-)"
          {
            echo "tag=$tag_name"
            echo "version=$version"
            echo "artifact_name=${base_name}-${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain --build-cache --parallel --max-workers=2 \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            build \
            -Pmod_version="${{ steps.metadata.outputs.version }}" \
            -Parchives_base_name="${{ steps.metadata.outputs.artifact_name }}"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd build/libs
            sha256sum *.jar
          ) > build/checksums-sha256.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          if-no-files-found: error
          path: |
            build/libs/*.jar
            build/checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.tag }}
          prerelease: ${{ contains(steps.metadata.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.metadata.outputs.version, '-') }}
          files: |
            build/libs/*.jar
            build/checksums-sha256.txt
          body: |
            Automated release for `${{ steps.metadata.outputs.tag }}`.

            Commit: ${{ github.sha }}
